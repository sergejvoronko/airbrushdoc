      id:'tamiya',
      name:'Tamiya Acrylics (X/XF Series)',
      brand:'Tamiya',
      type:'Alcohol-based acrylic',
      priceLevel:1, priceLabel:'Budget-friendly',
      tags:['Alcohol-based','Hobby-grade','Self-leveling','Durable'],
      tip:'Thin with Tamiya X-20A thinner at roughly 1:1 ratio. Spray at 15–20 PSI for smooth coats.',
      why:'Industry-standard model paint with unmatched self-leveling and a huge color catalog at pocket-friendly prices.',
      surface:[0,1,5,3,3,1],
      finish:[5,5,4,4],
      priority:[5,5,3,4],
      budget:[5,4,2]
    },
    {
      id:'house-of-kolor',
      name:'House of Kolor',
      brand:'House of Kolor',
      type:'Solvent-based urethane',
      priceLevel:3, priceLabel:'Premium',
      tags:['Solvent-based','Candy colors','Automotive','Professional'],
      tip:'Requires proper ventilation and respirator. Apply over HOK primer/sealer for true candy effects.',
      why:'The gold standard for custom automotive and helmet painting — legendary candy and pearl effects.',
      surface:[0,1,2,5,2,2],
      finish:[2,5,5,3],
      priority:[5,1,3,1],
      budget:[0,2,5]
    },
    {
      id:'mr-color',
      name:'Mr. Color (Mr. Hobby)',
      brand:'Mr. Hobby / GSI Creos',
      type:'Lacquer-based',
      priceLevel:2, priceLabel:'Mid-range',
      tags:['Lacquer-based','Ultra-smooth','Fast cure','Durable'],
      tip:'Use Mr. Color Leveling Thinner for mirror-smooth finishes. Always spray in a ventilated booth.',
      why:'Lacquer-based formula that self-levels to a glass-smooth finish — preferred by competition modelers.',
      surface:[0,1,5,4,3,1],
      finish:[4,5,4,3],
      priority:[5,2,4,3],
      budget:[2,5,4]
    },
    {
      id:'etac-efx',
      name:"E'TAC EFX Colors",
      brand:"E'TAC",
      type:'Water-based acrylic',
      priceLevel:2, priceLabel:'Mid-range',
      tags:['Water-based','Private label','Smooth flow','Multi-surface'],
      tip:'Spray at 15–25 PSI. Works great straight from the bottle on most surfaces without thinning.',
      why:'Under-the-radar favorite among pros for buttery-smooth spray and excellent multi-surface adhesion.',
      surface:[3,4,3,3,4,3],
      finish:[4,4,2,4],
      priority:[4,3,4,4],
      budget:[3,5,3]
    }
  ];

  /* ═══════════════════════════════════════
     QUESTIONS
  ═══════════════════════════════════════ */
  const QUESTIONS = [
    {
      key:'surface', weight:3,
      text:'What surface are you painting on?',
      layout:'grid',
      options:[
        {label:'Fabric / T-shirts', emoji:'👕'},
        {label:'Canvas / Paper', emoji:'🖼️'},
        {label:'Plastic Models', emoji:'🛩️'},
        {label:'Metal / Automotive', emoji:'🚗'},
        {label:'Wood', emoji:'🪵'},
        {label:'Leather', emoji:'👜'}
      ]
    },
    {
      key:'finish', weight:2,
      text:'What finish are you going for?',
      layout:'list',
      options:[
        {label:'Matte / Flat', desc:'No shine — smooth, velvety look'},
        {label:'Glossy / High-shine', desc:'Mirror-like reflective finish'},
        {label:'Metallic / Pearl', desc:'Metallic flake or candy color effects'},
        {label:'Transparent / Glazes', desc:'See-through layers for depth & blending'}
      ]
    },
    {
      key:'priority', weight:2,
      text:'What matters most for this project?',
      layout:'list',
      options:[
        {label:'Best coverage & durability', desc:'Paint that sticks and lasts'},
        {label:'Staying within budget', desc:'Most bang for my buck'},
        {label:'Finest detail & color accuracy', desc:'Precision and true-to-life color'},
        {label:'Easy cleanup & low odor', desc:'Water cleanup, studio-friendly'}
      ]
    },
    {
      key:'budget', weight:1.5,
      text:'What\'s your paint budget per bottle?',
      layout:'list',
      options:[
        {label:'Under $5', desc:'Keeping it lean — hobby on a budget'},
        {label:'$5 – $12', desc:'Mid-range — best value spot'},
        {label:'$12+', desc:'Premium — quality is worth it'}
      ]
    }
  ];

  /* ═══════════════════════════════════════
     STATE
  ═══════════════════════════════════════ */
  let curQ = 0, answers = {};
  const TOTAL = QUESTIONS.length;

  /* ═══════════════════════════════════════
     RENDER
  ═══════════════════════════════════════ */
  function renderQ(idx, dir) {
    const stage = document.getElementById('abpStage');
    const old = stage.querySelector('.abp-active');
    const q = QUESTIONS[idx];

    const card = document.createElement('div');
    card.className = 'abp-card';
    if(dir === 'back') card.style.transform = 'translateX(-60px) scale(0.96)';

    let optHTML = '';
    if(q.layout === 'grid') {
      optHTML = `<div class="abp-options-grid">${q.options.map((o,i)=>`
        <div class="abp-opt abp-opt-tile${answers[q.key]===i?' abp-selected':''}" data-i="${i}" onclick="abpPick('${q.key}',${i},this)">
          <div class="abp-opt-emoji">${o.emoji}</div>
          <div class="abp-opt-label">${o.label}</div>
        </div>
      `).join('')}</div>`;
    } else {
      optHTML = `<div class="abp-options-list">${q.options.map((o,i)=>`
        <div class="abp-opt${answers[q.key]===i?' abp-selected':''}" data-i="${i}" onclick="abpPick('${q.key}',${i},this)">
          <div class="abp-opt-radio"><div class="abp-opt-radio-dot"></div></div>
          <div>
            <div class="abp-opt-label">${o.label}</div>
            ${o.desc?`<div class="abp-opt-desc">${o.desc}</div>`:''}
          </div>
        </div>
      `).join('')}</div>`;
    }

    card.innerHTML = `
      <div class="abp-q-num">Question ${idx+1} of ${TOTAL}</div>
      <div class="abp-q-text">${q.text}</div>
      ${optHTML}
    `;

    stage.appendChild(card);
    requestAnimationFrame(()=>{
      if(old) {
        old.classList.remove('abp-active');
        if(dir==='back') { old.style.transform='translateX(60px) scale(0.96)'; old.style.opacity='0'; }
        else old.classList.add('abp-exit-left');
        setTimeout(()=>old.remove(),500);
      }
      requestAnimationFrame(()=>card.classList.add('abp-active'));
    });
    updateProgress(idx);
  }

  function updateProgress(idx) {
    const pct = Math.round((idx/TOTAL)*100);
    document.getElementById('abpFill').style.width = pct+'%';
    document.getElementById('abpDot').style.opacity = pct > 0 ? '1' : '0';
    document.getElementById('abpStep').textContent = `Question ${idx+1} of ${TOTAL}`;
    document.getElementById('abpPct').textContent = pct+'%';
    document.getElementById('abpBack').disabled = (idx === 0);
  }

  /* ═══════════════════════════════════════
     INTERACTIONS
  ═══════════════════════════════════════ */
  window.abpPick = function(key, optIdx, el) {
    answers[key] = optIdx;
    const parent = el.closest('.abp-options-list, .abp-options-grid');
    parent.querySelectorAll('.abp-opt').forEach(o=>o.classList.remove('abp-selected'));
    el.classList.add('abp-selected');
    setTimeout(()=>{
      if(curQ < TOTAL-1) { curQ++; renderQ(curQ,'forward'); }
      else showResults();
    }, 350);
  };

  window.abpGoBack = function() {
    if(curQ > 0) { curQ--; renderQ(curQ,'back'); }
  };

  window.abpStart = function() {
    document.getElementById('abpIntro').style.display = 'none';
    document.getElementById('abpBody').style.display = 'block';
    renderQ(0,'forward');
  };

  window.abpRetake = function() {
    curQ = 0; answers = {};
    document.getElementById('abpResults').classList.remove('abp-show');
    document.getElementById('abpResults').style.display = 'none';
    document.getElementById('abpLoading').classList.remove('abp-show');
    document.getElementById('abpBody').style.display = 'none';
    document.getElementById('abpIntro').style.display = 'block';
  };

  /* ═══════════════════════════════════════
     SCORING
  ═══════════════════════════════════════ */
  function computeResults() {
    return PAINTS.map(p => {
      let total = 0, maxT = 0;
      QUESTIONS.forEach(q => {
        const w = q.weight;
        const chosen = answers[q.key];
        if(chosen !== undefined && p[q.key]) {
          total += (p[q.key][chosen] || 0) * w;
          maxT += 5 * w;
        }
      });
      return { ...p, matchPct: maxT > 0 ? Math.round((total/maxT)*100) : 0 };
    }).sort((a,b) => b.matchPct - a.matchPct).slice(0,3);
  }

  /* ═══════════════════════════════════════
     RESULTS
  ═══════════════════════════════════════ */
  function showResults() {
    document.getElementById('abpBody').style.display = 'none';
    const loading = document.getElementById('abpLoading');
    loading.classList.add('abp-show');

    setTimeout(()=>{
      loading.classList.remove('abp-show');
      const top3 = computeResults();
      const container = document.getElementById('abpResults');

      const surfaceNames = ['fabric & T-shirts','canvas & paper','plastic models','metal & automotive','wood','leather'];
      const finishNames = ['a matte','a glossy','a metallic','a transparent'];
      const sName = surfaceNames[answers.surface] || 'your surface';
      const fName = finishNames[answers.finish] || 'your desired';

      function priceDots(level) {
        let d = '';
        for(let i=1;i<=3;i++) d += `<div class="abp-rec-price-dot${i<=level?' abp-filled':''}"></div>`;
        return d;
      }

      container.innerHTML = `
        <div class="abp-header">
          <div class="abp-header-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#F4671A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </div>
          <h2 class="abp-title">Your <span class="abp-title-accent">Paint Matches</span></h2>
        </div>
        <p class="abp-results-tagline">For <strong>${sName}</strong> with <strong>${fName} finish</strong>, here are your top picks:</p>

        ${top3.map((p,i)=>`
          <div class="abp-rec${i===0?' abp-top':''}">
            <div class="abp-rec-head">
              <span class="abp-rec-rank">${i===0?'🏆 Best Match':'#'+(i+1)+' Runner-up'}</span>
              <span class="abp-rec-match"><b>${p.matchPct}%</b> match</span>
            </div>
            <div class="abp-rec-name">${p.name}</div>
            <div class="abp-rec-brand">${p.brand} · ${p.type}</div>
            <div class="abp-rec-why">${p.why}</div>
            <div class="abp-bar-track"><div class="abp-bar-fill" data-pct="${p.matchPct}"></div></div>
            <div class="abp-tags">
              ${p.tags.map(t=>{
                if(t.toLowerCase().includes('water')||t.toLowerCase().includes('solvent')||t.toLowerCase().includes('lacquer')||t.toLowerCase().includes('alcohol')) return `<span class="abp-tag abp-tag-type">${t}</span>`;
                return `<span class="abp-tag abp-tag-neutral">${t}</span>`;
              }).join('')}
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
              <div class="abp-rec-price">
                <div class="abp-rec-price-dots">${priceDots(p.priceLevel)}</div>
                ${p.priceLabel}
              </div>
            </div>
            ${i===0?`<div class="abp-tip-box"><strong>Pro Tip:</strong> ${p.tip}</div>`:''}
          </div>
        `).join('')}

        <div class="abp-cta-section">
          <a class="abp-cta-link" href="/best-airbrush-for-beginners/">
            Read Full Paint Guide
            <svg viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <br>
          <button class="abp-retake" onclick="abpRetake()">↻ Try Different Options</button>
        </div>
      `;

      container.style.display = 'block';
      requestAnimationFrame(()=>{
        container.classList.add('abp-show');
        setTimeout(()=>{
          container.querySelectorAll('.abp-bar-fill').forEach(bar=>{
            bar.style.width = bar.getAttribute('data-pct')+'%';
          });
        },300);
      });
    },1200);
  }

})();
</script>
