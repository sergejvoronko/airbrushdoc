<style>
/* ── Reset ── */
.abt-root, .abt-root * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }

.abt-root {
  --abt-bg: #111111;
  --abt-surface: #1A1A1A;
  --abt-surface2: #222222;
  --abt-surface3: #2A2A2A;
  --abt-orange: #F4671A;
  --abt-orange-glow: rgba(244,103,26,0.35);
  --abt-orange-soft: rgba(244,103,26,0.10);
  --abt-green: #4ADE80;
  --abt-green-soft: rgba(74,222,128,0.10);
  --abt-yellow: #FACC15;
  --abt-yellow-soft: rgba(250,204,21,0.10);
  --abt-red: #F87171;
  --abt-red-soft: rgba(248,113,113,0.10);
  --abt-blue: #60A5FA;
  --abt-blue-soft: rgba(96,165,250,0.10);
  --abt-text: #F0F0F0;
  --abt-text-dim: #999999;
  --abt-text-muted: #666666;
  --abt-border: #2A2A2A;
  --abt-radius: 12px;
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 48px;
  color: var(--abt-text);
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.abt-header { text-align:center; margin-bottom:28px; }
.abt-header-icon {
  display:inline-flex; align-items:center; justify-content:center;
  width:56px; height:56px; border-radius:50%;
  background:var(--abt-orange-soft);
  margin-bottom:16px;
  animation: abt-pulse 2.5s ease-in-out infinite;
}
@keyframes abt-pulse {
  0%,100% { box-shadow:0 0 0 0 var(--abt-orange-glow); }
  50% { box-shadow:0 0 0 12px transparent; }
}
.abt-header-icon svg { width:28px; height:28px; }
.abt-title { font-size:clamp(1.5rem,4vw,2rem); font-weight:800; letter-spacing:-0.02em; line-height:1.2; margin-bottom:6px; }
.abt-title-accent { color:var(--abt-orange); }
.abt-subtitle { font-size:0.95rem; color:var(--abt-text-dim); font-weight:300; }

/* ── Progress Breadcrumbs ── */
.abt-breadcrumbs {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-bottom:20px; padding:12px 16px;
  background:var(--abt-surface);
  border:1px solid var(--abt-border);
  border-radius:10px;
}
.abt-crumb {
  font-size:0.75rem; font-weight:500;
  padding:4px 10px; border-radius:6px;
  background:var(--abt-surface2); color:var(--abt-text-dim);
  white-space:nowrap; max-width:160px;
  overflow:hidden; text-overflow:ellipsis;
}
.abt-crumb-active { background:var(--abt-orange-soft); color:var(--abt-orange); }
.abt-crumb-arrow { color:var(--abt-text-muted); font-size:0.7rem; flex-shrink:0; }

/* ── Intro ── */
.abt-intro { text-align:center; }
.abt-intro-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px; margin:24px 0 28px; text-align:left;
}
.abt-intro-card {
  display:flex; align-items:flex-start; gap:10px;
  padding:14px; border-radius:10px;
  background:var(--abt-surface); border:1px solid var(--abt-border);
}
.abt-intro-icon {
  flex-shrink:0; width:32px; height:32px; border-radius:8px;
  background:var(--abt-orange-soft);
  display:flex; align-items:center; justify-content:center; font-size:1rem;
}
.abt-intro-text { font-size:0.82rem; line-height:1.4; }
.abt-intro-text strong { display:block; font-size:0.88rem; margin-bottom:2px; color:var(--abt-text); }
.abt-intro-text span { color:var(--abt-text-dim); }

/* ── Card Stage ── */
.abt-card-stage { position:relative; min-height:380px; }
.abt-card {
  position:absolute; inset:0;
  background:var(--abt-surface);
  border:1px solid var(--abt-border);
  border-radius:var(--abt-radius);
  padding:clamp(20px,4vw,32px);
  opacity:0; transform:translateX(60px) scale(0.96);
  transition:opacity 0.45s ease, transform 0.45s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
  display:flex; flex-direction:column;
}
.abt-card.abt-active {
  opacity:1; transform:translateX(0) scale(1);
  pointer-events:auto; position:relative;
}
.abt-card.abt-exit-left {
  opacity:0; transform:translateX(-60px) scale(0.96); pointer-events:none;
}

.abt-q-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-size:0.72rem; font-weight:600; text-transform:uppercase;
  letter-spacing:0.1em; color:var(--abt-orange); margin-bottom:12px;
}
.abt-q-badge-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--abt-orange);
  animation:abt-dot-pulse 1.5s ease infinite;
}
@keyframes abt-dot-pulse {
  0%,100% { opacity:1; } 50% { opacity:0.4; }
}
.abt-q-text { font-size:clamp(1.1rem,3vw,1.35rem); font-weight:600; line-height:1.35; margin-bottom:20px; }

/* ── Options ── */
.abt-options { display:flex; flex-direction:column; gap:10px; flex:1; }
.abt-options-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px; flex:1;
}
.abt-opt {
  display:flex; align-items:center; gap:12px;
  padding:13px 16px; border-radius:10px;
  background:var(--abt-surface2);
  border:1.5px solid var(--abt-border);
  cursor:pointer; transition:all 0.25s ease;
  -webkit-tap-highlight-color:transparent;
}
.abt-opt:hover { border-color:var(--abt-orange); background:var(--abt-orange-soft); }
.abt-opt.abt-selected {
  border-color:var(--abt-orange); background:var(--abt-orange-soft);
  box-shadow:0 0 16px rgba(244,103,26,0.12);
}
.abt-opt-tile {
  flex-direction:column; align-items:center; text-align:center;
  padding:18px 10px; gap:8px;
}
.abt-opt-tile .abt-opt-emoji { font-size:1.5rem; }

.abt-opt-radio {
  flex-shrink:0; width:20px; height:20px; border-radius:50%;
  border:2px solid var(--abt-text-muted);
  display:flex; align-items:center; justify-content:center;
  transition:all 0.25s;
}
.abt-opt.abt-selected .abt-opt-radio { border-color:var(--abt-orange); }
.abt-opt-radio-dot {
  width:10px; height:10px; border-radius:50%;
  background:var(--abt-orange); transform:scale(0);
  transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.abt-opt.abt-selected .abt-opt-radio-dot { transform:scale(1); }
.abt-opt-label { font-size:0.92rem; font-weight:500; line-height:1.3; }
.abt-opt-desc { font-size:0.78rem; color:var(--abt-text-dim); margin-top:2px; font-weight:400; }

/* ── Nav ── */
.abt-nav { display:flex; justify-content:space-between; margin-top:20px; }
.abt-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:10px 22px; border-radius:8px; border:none;
  font-family:'Outfit',sans-serif; font-size:0.88rem; font-weight:600;
  cursor:pointer; transition:all 0.25s;
}
.abt-btn-back {
  background:transparent; color:var(--abt-text-dim);
  border:1px solid var(--abt-border);
}
.abt-btn-back:hover { color:var(--abt-text); border-color:var(--abt-text-muted); }
.abt-btn-back:disabled { opacity:0.3; cursor:default; }
.abt-btn-primary {
  background:var(--abt-orange); color:#fff;
  box-shadow:0 4px 16px rgba(244,103,26,0.3);
}
.abt-btn-primary:hover { filter:brightness(1.1); transform:translateY(-1px); }

/* ── Loading ── */
.abt-loading { display:none; text-align:center; padding:60px 20px; }
.abt-loading.abt-show { display:block; }
.abt-spinner {
  width:48px; height:48px; margin:0 auto 20px;
  border:3px solid var(--abt-surface2);
  border-top-color:var(--abt-orange);
  border-radius:50%; animation:abt-spin 0.8s linear infinite;
}
@keyframes abt-spin { to { transform:rotate(360deg); } }
.abt-loading-text { font-size:0.95rem; color:var(--abt-text-dim); }

/* ── Results / Diagnosis ── */
.abt-results { display:none; }
.abt-results.abt-show { display:block; }

.abt-diag-card {
  background:var(--abt-surface);
  border:1px solid var(--abt-border);
  border-radius:var(--abt-radius);
  overflow:hidden;
  opacity:0; transform:translateY(16px);
  animation:abt-card-in 0.5s ease forwards;
}
.abt-diag-card:nth-child(n+2) { margin-top:14px; }
.abt-diag-card:nth-child(1) { animation-delay:0.1s; }
.abt-diag-card:nth-child(2) { animation-delay:0.25s; }
.abt-diag-card:nth-child(3) { animation-delay:0.4s; }
.abt-diag-card:nth-child(4) { animation-delay:0.55s; }
@keyframes abt-card-in { to { opacity:1; transform:translateY(0); } }

/* Severity banner */
.abt-severity {
  padding:10px 20px; font-size:0.75rem; font-weight:700;
  text-transform:uppercase; letter-spacing:0.1em;
  display:flex; align-items:center; gap:8px;
}
.abt-sev-easy { background:var(--abt-green-soft); color:var(--abt-green); }
.abt-sev-medium { background:var(--abt-yellow-soft); color:var(--abt-yellow); }
.abt-sev-hard { background:var(--abt-red-soft); color:var(--abt-red); }

.abt-diag-body { padding:clamp(18px,3vw,24px); }
.abt-diag-title { font-size:clamp(1.1rem,3vw,1.25rem); font-weight:700; margin-bottom:4px; }
.abt-diag-cause {
  font-size:0.85rem; color:var(--abt-text-dim); line-height:1.55;
  margin-bottom:16px; padding-bottom:16px;
  border-bottom:1px solid var(--abt-border);
}
.abt-diag-cause strong { color:var(--abt-text); font-weight:600; }

/* Steps */
.abt-steps { display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
.abt-step {
  display:flex; gap:12px; align-items:flex-start;
}
.abt-step-num {
  flex-shrink:0; width:28px; height:28px; border-radius:50%;
  background:var(--abt-orange-soft); color:var(--abt-orange);
  display:flex; align-items:center; justify-content:center;
  font-size:0.78rem; font-weight:700; margin-top:1px;
}
.abt-step-text { font-size:0.88rem; line-height:1.55; }
.abt-step-text strong { color:var(--abt-text); }

/* Product recommendations */
.abt-products-label {
  font-size:0.72rem; font-weight:700; text-transform:uppercase;
  letter-spacing:0.1em; color:var(--abt-orange);
  margin-bottom:10px;
}
.abt-product-links { display:flex; flex-wrap:wrap; gap:8px; }
.abt-product-link {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:8px;
  background:var(--abt-surface2); color:var(--abt-text);
  text-decoration:none; font-size:0.82rem; font-weight:500;
  border:1px solid var(--abt-border);
  transition:all 0.25s;
}
.abt-product-link:hover {
  border-color:var(--abt-orange); background:var(--abt-orange-soft);
  color:var(--abt-orange);
}
.abt-product-link svg { width:12px; height:12px; flex-shrink:0; }

/* Pro tip box */
.abt-protip {
  background:var(--abt-blue-soft);
  border:1px solid rgba(96,165,250,0.18);
  border-radius:10px; padding:14px 16px;
  margin-top:16px;
  font-size:0.83rem; line-height:1.55; color:var(--abt-text-dim);
}
.abt-protip strong { color:var(--abt-blue); }

/* Didn't fix it callout */
.abt-notfixed {
  background:var(--abt-surface);
  border:1px solid var(--abt-border);
  border-radius:var(--abt-radius);
  padding:20px; text-align:center; margin-top:14px;
  opacity:0; animation:abt-card-in 0.5s ease 0.7s forwards;
}
.abt-notfixed-title { font-size:0.95rem; font-weight:600; margin-bottom:6px; }
.abt-notfixed-text { font-size:0.83rem; color:var(--abt-text-dim); line-height:1.5; margin-bottom:12px; }

/* ── CTA ── */
.abt-cta-section { text-align:center; margin-top:28px; }
.abt-cta-link {
  display:inline-flex; align-items:center; gap:8px;
  padding:14px 32px; border-radius:10px;
  background:var(--abt-orange); color:#fff;
  text-decoration:none; font-weight:700; font-size:1rem;
  box-shadow:0 4px 20px rgba(244,103,26,0.35);
  transition:all 0.25s;
}
.abt-cta-link:hover { filter:brightness(1.1); transform:translateY(-2px);
  box-shadow:0 6px 28px rgba(244,103,26,0.45); }
.abt-retake {
  display:inline-block; margin-top:16px;
  font-size:0.85rem; color:var(--abt-text-muted);
  cursor:pointer; border:none; background:none;
  font-family:'Outfit',sans-serif; text-decoration:underline;
  text-underline-offset:3px; transition:color 0.2s;
}
.abt-retake:hover { color:var(--abt-text-dim); }

/* ── Responsive ── */
@media(max-width:480px) {
  .abt-root { padding:12px 10px 32px; }
  .abt-card { padding:18px 14px; }
  .abt-card-stage { min-height:360px; }
  .abt-options-grid { grid-template-columns:repeat(2,1fr); }
  .abt-intro-grid { grid-template-columns:1fr; }
  .abt-breadcrumbs { gap:5px; padding:10px 12px; }
  .abt-crumb { max-width:110px; font-size:0.7rem; }
}
</style>

<div class="abt-root" id="abtTool">

  <!-- Intro -->
  <div id="abtIntro" class="abt-intro">
    <div class="abt-header">
      <div class="abt-header-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#F4671A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>
      </div>
      <h1 class="abt-title">Airbrush <span class="abt-title-accent">Troubleshooter</span></h1>
      <p class="abt-subtitle">Diagnose your problem · Get step-by-step fixes in seconds</p>
    </div>

      <div class="abt-intro-card">

        <div class="abt-intro-text"><strong>Smart Diagnosis</strong><span>Branching questions find the real cause</span></div>
      </div>
      <div class="abt-intro-card">
        <div class="abt-intro-icon">🔧</div>
        <div class="abt-intro-text"><strong>Step-by-Step</strong><span>Clear fix instructions with product links</span></div>
      </div>
      <div class="abt-intro-card">
        <div class="abt-intro-icon">⚡</div>

      </div>

      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-left:4px;"><path d="M6 3l5 5-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
(function(){

  /* ═══════════════════════════════════════
     DECISION TREE
     Each node has: question, options
     Each option leads to either another node key
     or a diagnosis key (prefixed with "dx_")
  ═══════════════════════════════════════ */
  const TREE = {

    /* ── ROOT ── */
    root: {
      question:"What problem are you experiencing?",
      layout:"grid",
      options:[
        {label:"Spitting & splattering", emoji:"💦", next:"spit_paint"},
        {label:"Uneven spray pattern", emoji:"🎯", next:"uneven_when"},
        {label:"Paint won't flow", emoji:"🚫", next:"noflow_air"},
        {label:"Air leaking", emoji:"💨", next:"leak_where"},
        {label:"Clogging / tip dry", emoji:"🔒", next:"clog_when"},
        {label:"Bubbling in cup", emoji:"🫧", next:"bubble_cause"},
        {label:"Off-center spray", emoji:"↗️", next:"dx_offcenter"},
        {label:"Sticky / stiff trigger", emoji:"🎚️", next:"trigger_detail"}
      ]
    },

    /* ── SPITTING / SPLATTERING BRANCH ── */
    spit_paint: {
      question:"How would you describe your paint consistency right now?",
      options:[
        {label:"Too thick / straight from bottle", desc:"Haven't thinned it yet", next:"spit_pressure"},
        {label:"Properly thinned (milk-like)", desc:"Already reduced to correct ratio", next:"spit_pressure"},
        {label:"Very thin / watery", desc:"May have over-thinned", next:"dx_spit_overthinned"},
        {label:"Not sure", desc:"I'm guessing at this point", next:"spit_pressure"}
      ]
    },
    spit_pressure: {
      question:"What PSI are you spraying at?",
      options:[
        {label:"Under 15 PSI", desc:"Low pressure range", next:"dx_spit_lowpsi"},
        {label:"15–25 PSI", desc:"Normal range", next:"spit_cleaned"},
        {label:"Over 25 PSI", desc:"Higher pressure", next:"spit_cleaned"},
        {label:"No idea / no gauge", desc:"I don't have a regulator or gauge", next:"dx_spit_nogauge"}
      ]
    },
    spit_cleaned: {
      question:"When did you last fully disassemble and clean your airbrush?",
      options:[
        {label:"Just cleaned it", desc:"Fresh clean before this session", next:"dx_spit_nozzle"},
        {label:"Yesterday or a few days ago", desc:"Recent but not right before", next:"dx_spit_residue"},
        {label:"Can't remember / weeks ago", desc:"It's been a while", next:"dx_spit_deepclean"}
      ]
    },

    /* ── UNEVEN SPRAY BRANCH ── */
    uneven_when: {
      question:"When does the uneven pattern happen?",
      options:[
        {label:"Right from the start", desc:"First trigger pull", next:"uneven_pattern"},
        {label:"After spraying a while", desc:"Starts fine, then degrades", next:"dx_uneven_tipdry"},
        {label:"Comes and goes randomly", desc:"Intermittent pulsing or fluttering", next:"dx_uneven_airleak"}
      ]
    },
    uneven_pattern: {
      question:"How would you describe the pattern?",
      options:[
        {label:"Heavy on one side", desc:"Sprays more left, right, up, or down", next:"dx_offcenter"},
        {label:"Grainy / sandy texture", desc:"Rough, speckled finish like sandpaper", next:"dx_uneven_grainy"},
        {label:"Spidering / starfish shapes", desc:"Lines radiating out from center", next:"dx_uneven_spider"},
        {label:"Pulsing / stuttering", desc:"Spray surges in and out", next:"dx_uneven_airleak"}
      ]
    },

    /* ── NO PAINT FLOW BRANCH ── */
    noflow_air: {
      question:"Is air coming through when you press the trigger down?",
      options:[
        {label:"Yes, air flows but no paint", desc:"I hear/feel air", next:"noflow_needle"},
        {label:"No — no air at all", desc:"Complete silence, nothing happens", next:"dx_noflow_noair"},
        {label:"Very weak air", desc:"Some air but barely any pressure", next:"dx_noflow_weakair"}
      ]
    },
    noflow_needle: {
      question:"Have you checked the needle position?",
      options:[
        {label:"Needle is fully forward", desc:"Pushed in snug against nozzle", next:"dx_noflow_clog"},
        {label:"Needle seems pulled back", desc:"There's a gap", next:"dx_noflow_needle"},
        {label:"Haven't checked", desc:"Not sure how", next:"dx_noflow_clog"}
      ]
    },

    /* ── AIR LEAK BRANCH ── */
    leak_where: {
      question:"Where is the air leaking from?",
      options:[
        {label:"Around the nozzle / head", desc:"Front of the airbrush", next:"dx_leak_head"},
        {label:"At the hose connection", desc:"Where hose meets airbrush", next:"dx_leak_hose"},
        {label:"From the trigger area", desc:"Air escapes when trigger is released", next:"dx_leak_valve"},
        {label:"Not sure — I just hear hissing", desc:"Can't pinpoint the location", next:"dx_leak_general"}
      ]
    },

    /* ── CLOGGING BRANCH ── */
    clog_when: {
      question:"When does the clogging happen?",
      options:[
        {label:"Almost immediately", desc:"Clogs within first minute of spraying", next:"clog_paint"},
        {label:"After 5–10 minutes", desc:"Starts fine, then builds up", next:"dx_clog_tipdry"},
        {label:"Frequently / every session", desc:"It's a constant recurring issue", next:"clog_paint"}
      ]
    },
    clog_paint: {
      question:"What type of paint are you using?",
      options:[
        {label:"Water-based acrylic", desc:"Createx, Vallejo, Golden, etc.", next:"dx_clog_acrylic"},

  /* ═══════════════════════════════════════
     STATE
  ═══════════════════════════════════════ */
  let history = [];
  let breadcrumbLabels = [];

  /* ═══════════════════════════════════════
     RENDERING
  ═══════════════════════════════════════ */
  function renderNode(nodeKey, dir) {
    const node = TREE[nodeKey];
    const stage = document.getElementById('abtStage');
    const old = stage.querySelector('.abt-active');

    const card = document.createElement('div');
    card.className = 'abt-card';
    if(dir === 'back') card.style.transform = 'translateX(-60px) scale(0.96)';

    let optHTML = '';
    if(node.layout === 'grid') {
      optHTML = `<div class="abt-options-grid">${node.options.map((o,i)=>`
        <div class="abt-opt abt-opt-tile" data-i="${i}" onclick="abtPick('${nodeKey}',${i})">
          <div class="abt-opt-emoji">${o.emoji||'🔧'}</div>
          <div class="abt-opt-label">${o.label}</div>
        </div>
      `).join('')}</div>`;
    } else {
      optHTML = `<div class="abt-options">${node.options.map((o,i)=>`
        <div class="abt-opt" data-i="${i}" onclick="abtPick('${nodeKey}',${i})">
          <div class="abt-opt-radio"><div class="abt-opt-radio-dot"></div></div>
          <div>
            <div class="abt-opt-label">${o.label}</div>
            ${o.desc?`<div class="abt-opt-desc">${o.desc}</div>`:''}
          </div>
        </div>
      `).join('')}</div>`;
    }

    card.innerHTML = `
      <div class="abt-q-badge">
        <div class="abt-q-badge-dot"></div>
        Diagnosing${history.length > 0 ? ' · Step '+(history.length+1) : ''}
      </div>
      <div class="abt-q-text">${node.question}</div>
      ${optHTML}
    `;

    stage.appendChild(card);
    requestAnimationFrame(()=>{
      if(old) {
        old.classList.remove('abt-active');
        if(dir==='back') { old.style.transform='translateX(60px) scale(0.96)'; old.style.opacity='0'; }
        else old.classList.add('abt-exit-left');
        setTimeout(()=>old.remove(),500);
      }
      requestAnimationFrame(()=>card.classList.add('abt-active'));
    });

    document.getElementById('abtBack').disabled = (history.length === 0);
    renderBreadcrumbs();
  }

  function renderBreadcrumbs() {
    const wrap = document.getElementById('abtBreadcrumbs');
    if(breadcrumbLabels.length === 0) { wrap.innerHTML='<span class="abt-crumb abt-crumb-active">Start</span>'; return; }
    let html = '';
    breadcrumbLabels.forEach((label, i) => {
      if(i > 0) html += '<span class="abt-crumb-arrow">›</span>';
      const isLast = i === breadcrumbLabels.length - 1;
      html += `<span class="abt-crumb${isLast?' abt-crumb-active':''}">${label}</span>`;
    });
    wrap.innerHTML = html;
  }

  /* ═══════════════════════════════════════
     INTERACTIONS
  ═══════════════════════════════════════ */
  window.abtPick = function(nodeKey, optIdx) {
    const node = TREE[nodeKey];
    const opt = node.options[optIdx];

    // Animate selection
    const stage = document.getElementById('abtStage');
    const activeCard = stage.querySelector('.abt-active');
    if(activeCard) {
      const allOpts = activeCard.querySelectorAll('.abt-opt');
      allOpts.forEach(o=>o.classList.remove('abt-selected'));
      allOpts[optIdx].classList.add('abt-selected');
    }

    history.push({ nodeKey, optIdx });
    breadcrumbLabels.push(opt.label.length > 20 ? opt.label.substring(0,18)+'…' : opt.label);

    setTimeout(()=>{
      if(opt.next.startsWith('dx_')) {
        showDiagnosis(opt.next);
      } else {
        renderNode(opt.next, 'forward');
      }
    }, 350);
  };

  window.abtGoBack = function() {
    if(history.length === 0) return;
    const prev = history.pop();
    breadcrumbLabels.pop();
    renderNode(prev.nodeKey, 'back');
  };

  window.abtStart = function() {
    document.getElementById('abtIntro').style.display = 'none';
    document.getElementById('abtBody').style.display = 'block';
    history = [];
    breadcrumbLabels = [];
    renderNode('root','forward');
  };

  window.abtRetake = function() {
    history = [];
    breadcrumbLabels = [];
    document.getElementById('abtResults').classList.remove('abt-show');
    document.getElementById('abtResults').style.display = 'none';
    document.getElementById('abtLoading').classList.remove('abt-show');
    document.getElementById('abtBody').style.display = 'none';
    document.getElementById('abtIntro').style.display = 'block';
  };

  /* ═══════════════════════════════════════
     SHOW DIAGNOSIS
  ═══════════════════════════════════════ */
  function showDiagnosis(dxKey) {
    document.getElementById('abtBody').style.display = 'none';
    const loading = document.getElementById('abtLoading');
    loading.classList.add('abt-show');

    setTimeout(()=>{
      loading.classList.remove('abt-show');
      const dx = DIAGNOSES[dxKey];
      if(!dx) return;
      const container = document.getElementById('abtResults');

      const sevClass = dx.severity==='easy'?'abt-sev-easy':dx.severity==='medium'?'abt-sev-medium':'abt-sev-hard';
      const sevEmoji = dx.severity==='easy'?'🟢':dx.severity==='medium'?'🟡':'🔴';

      const arrowSVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M4 12l8-8M4 4h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      container.innerHTML = `
        <div class="abt-header">
          <div class="abt-header-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#F4671A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <h2 class="abt-title">Diagnosis <span class="abt-title-accent">Complete</span></h2>
        </div>

        <div class="abt-diag-card">
          <div class="abt-severity ${sevClass}">${sevEmoji} ${dx.severityLabel}</div>
          <div class="abt-diag-body">
            <div class="abt-diag-title">${dx.title}</div>
            <div class="abt-diag-cause">${dx.cause}</div>
            <div class="abt-steps">
              ${dx.steps.map((s,i)=>`
                <div class="abt-step">
                  <div class="abt-step-num">${i+1}</div>
                  <div class="abt-step-text">${s}</div>
                </div>
              `).join('')}
            </div>
            ${dx.products.length > 0 ? `
              <div class="abt-products-label">🛒 Recommended Products</div>
              <div class="abt-product-links">
                ${dx.products.map(p=>`<a class="abt-product-link" href="${p.url}">${p.name} ${arrowSVG}</a>`).join('')}
              </div>
            ` : ''}
            ${dx.tip ? `<div class="abt-protip"><strong>💡 Pro Tip:</strong> ${dx.tip}</div>` : ''}
          </div>
        </div>

        <div class="abt-notfixed">
          <div class="abt-notfixed-title">Still not fixed?</div>
          <div class="abt-notfixed-text">Some problems have multiple causes. Try the wizard again with different answers, or check our full troubleshooting guide for advanced diagnostics.</div>
          <button class="abt-btn abt-btn-back" onclick="abtRetake()" style="margin-right:8px;">↻ Try Again</button>
          <a class="abt-btn abt-btn-primary" href="/blog/airbrush-troubleshooting-guide/" target="_blank" rel="noopener" style="text-decoration:none;">Full Guide</a>
        </div>

        <div class="abt-cta-section">
          <a class="abt-cta-link" href="/airbrush-reviews/" target="_blank" rel="noopener">
            Browse Airbrush Reviews
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <br>
          <button class="abt-retake" onclick="abtRetake()">↻ Diagnose Another Problem</button>
        </div>
      `;

      container.style.display = 'block';
      requestAnimationFrame(()=>container.classList.add('abt-show'));
    },1100);
  }

})();
</script>
