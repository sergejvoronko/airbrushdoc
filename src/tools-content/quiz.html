<script>
(function(){
  /* ═══════════════════════════════════════
     AIRBRUSH DATABASE
  ═══════════════════════════════════════ */
  const AIRBRUSHES = [
    {
      id:"hs-ultra",

      scores:{ skill:[2,4,5,3], useCase:[3,4,5,3,4], budget:[0,4,4], detail:[3,4,3], maint:[3,3,4], priority:[3,4,5,3] }
    },
    {
      id:"iwata-micron",
      name:"Iwata Custom Micron CM-C+",
      nozzle:"0.23mm",
      feed:"Gravity",
      type:"Dual-action",
      price:"$$$",
      tags:["0.23mm nozzle","Micro-air control","Premium build","Master-grade"],
      scores:{ skill:[0,1,4,5], useCase:[5,2,1,5,1], budget:[0,0,5], detail:[1,5,5], maint:[2,1,5], priority:[5,2,4,2] }
    },
    {
      id:"hs-infinity",
      name:"Harder & Steenbeck Infinity CR Plus",
      nozzle:"0.15mm",
      feed:"Gravity",
      type:"Dual-action",
      price:"$$$",
      tags:["0.15mm nozzle","Quick-fix system","Finest detail","German precision"],
      scores:{ skill:[0,1,3,5], useCase:[5,2,1,5,2], budget:[0,0,5], detail:[0,5,5], maint:[3,2,5], priority:[5,2,3,2] }
    }
  ];

  /* ═══════════════════════════════════════
     QUESTIONS
  ═══════════════════════════════════════ */
  const QUESTIONS = [
    {
      key:"skill", weight:2,
      text:"What's your airbrush experience level?",
      options:[
        {label:"Complete beginner",desc:"Never used an airbrush before"},
        {label:"Some experience",desc:"Practiced a few times, still learning"},
        {label:"Intermediate",desc:"Comfortable with basic techniques"},
        {label:"Advanced / Pro",desc:"Years of experience, seeking precision"}
      ]
    },
    {
      key:"useCase", weight:2,
      text:"What will you primarily use your airbrush for?",
      options:[
        {label:"Fine art & illustration",desc:"Portraits, photorealism, canvas work"},
        {label:"Scale models & miniatures",desc:"Model kits, tabletop figures, dioramas"},
        {label:"General crafts & DIY",desc:"T-shirts, cakes, nails, cosplay props"},
        {label:"Automotive & custom paint",desc:"Helmets, tanks, automotive details"},
        {label:"Multiple uses",desc:"I need something versatile for everything"}
      ]
    },
    {
      key:"budget", weight:2.5,
      text:"What's your budget range?",
      options:[
        {label:"Under $80",desc:"Entry-level, keeping costs low"},
        {label:"$80 – $180",desc:"Mid-range, best value sweet spot"},
        {label:"$180+",desc:"Premium quality, willing to invest"}
      ]
    },
    {
      key:"detail", weight:1.5,
      text:"How important is ultra-fine detail to you?",
      options:[
        {label:"Not a priority",desc:"Broad coverage & base coats matter more"},
        {label:"Very important",desc:"I need hair-thin lines & micro details"},
        {label:"Critical — it's everything",desc:"Photorealistic work demands the finest lines"}
      ]
    },
    {
      key:"maint", weight:1,
      text:"How do you feel about maintenance & cleaning?",
      options:[
        {label:"Keep it simple",desc:"Quick teardown, minimal fuss"},
        {label:"Moderate is fine",desc:"Standard cleaning routine, no problem"},
        {label:"I'll do whatever it takes",desc:"Detailed care for peak performance"}
      ]
    },
    {
      key:"priority", weight:1.5,
      text:"What matters most when choosing your airbrush?",
      options:[
        {label:"Finest possible detail",desc:"Precision above all else"},
        {label:"Easy learning curve",desc:"I want to get started quickly"},
        {label:"Versatility & range",desc:"One brush for many techniques"},
        {label:"Best value for money",desc:"Maximum bang for my buck"}
      ]
    }
  ];

  /* ═══════════════════════════════════════
     STATE
  ═══════════════════════════════════════ */
  let currentQ = 0;
  let answers = {};

  /* ═══════════════════════════════════════
     RENDER FUNCTIONS
  ═══════════════════════════════════════ */
  function renderQuestion(idx, direction) {
    const stage = document.getElementById('abCardStage');
    const old = stage.querySelector('.ab-active');

    const q = QUESTIONS[idx];
    const card = document.createElement('div');
    card.className = 'ab-card';
    card.innerHTML = `
      <div class="ab-q-number">Question ${idx+1} of ${QUESTIONS.length}</div>
      <div class="ab-q-text">${q.text}</div>
      <div class="ab-options">
        ${q.options.map((o,i)=>`
          <div class="ab-opt${answers[q.key]===i?' ab-selected':''}" data-idx="${i}" onclick="abSelect('${q.key}',${i},this)">
            <div class="ab-opt-radio"><div class="ab-opt-radio-dot"></div></div>
            <div>
              <div class="ab-opt-label">${o.label}</div>
              ${o.desc?`<div class="ab-opt-desc">${o.desc}</div>`:''}
            </div>
          </div>
        `).join('')}
      </div>
    `;

    if(direction==='back') {
      card.style.transform = 'translateX(-60px) scale(0.96)';
    }
    stage.appendChild(card);

    requestAnimationFrame(()=>{
      if(old) {
        old.classList.remove('ab-active');
        old.classList.add(direction==='back'?'':'ab-exit-left');
        if(direction==='back') {
          old.style.transform='translateX(60px) scale(0.96)';
          old.style.opacity='0';
        }
        setTimeout(()=>old.remove(),500);
      }
      requestAnimationFrame(()=>card.classList.add('ab-active'));
    });

    updateProgress(idx);
  }

  function updateProgress(idx) {
    const pct = Math.round(((idx)/QUESTIONS.length)*100);
    document.getElementById('abProgressFill').style.width = pct+'%';
    document.getElementById('abProgressDot').style.opacity = pct > 0 ? '1' : '0';
    document.getElementById('abStepLabel').textContent = `Question ${idx+1} of ${QUESTIONS.length}`;
    document.getElementById('abPctLabel').textContent = pct+'%';
    document.getElementById('abBackBtn').disabled = (idx === 0);
  }

  /* ═══════════════════════════════════════
     INTERACTIONS
  ═══════════════════════════════════════ */
  window.abSelect = function(key, optIdx, el) {
    answers[key] = optIdx;
    const opts = el.parentElement.querySelectorAll('.ab-opt');
    opts.forEach(o=>o.classList.remove('ab-selected'));
    el.classList.add('ab-selected');

    // Auto-advance after brief delay
    setTimeout(()=>{
      if(currentQ < QUESTIONS.length-1) {
        currentQ++;
        renderQuestion(currentQ,'forward');
      } else {
        showResults();
      }
    }, 350);
  };

  window.abGoBack = function() {
    if(currentQ > 0) {
      currentQ--;
      renderQuestion(currentQ,'back');
    }
  };

  window.abStartQuiz = function() {
    document.getElementById('abIntro').style.display = 'none';
    document.getElementById('abQuizBody').style.display = 'block';
    renderQuestion(0,'forward');
  };

  window.abRetake = function() {
    currentQ = 0;
    answers = {};
    document.getElementById('abResults').classList.remove('ab-show');
    document.getElementById('abResults').style.display = 'none';
    document.getElementById('abLoading').classList.remove('ab-show');
    document.getElementById('abQuizBody').style.display = 'none';
    document.getElementById('abIntro').style.display = 'block';
  };

  /* ═══════════════════════════════════════
     SCORING ENGINE
  ═══════════════════════════════════════ */
  function computeScores() {
    let results = AIRBRUSHES.map(ab => {
      let total = 0, maxTotal = 0;
      QUESTIONS.forEach(q => {
        const w = q.weight;
        const chosen = answers[q.key];
        if(chosen !== undefined && ab.scores[q.key]) {
          total += (ab.scores[q.key][chosen] || 0) * w;
          maxTotal += 5 * w;
        }
      });
      const pct = maxTotal > 0 ? Math.round((total/maxTotal)*100) : 0;
      return { ...ab, matchPct: pct };
    });

    results.sort((a,b) => b.matchPct - a.matchPct);
    return results.slice(0,3);
  }

  function getTagline(top) {
    const skill = answers.skill;
    const useCase = answers.useCase;
    const names = {0:'fine art',1:'models & miniatures',2:'crafts & DIY',3:'automotive work',4:'versatile projects'};
    const levels = {0:'beginning your airbrush journey',1:'building your skills',2:'at an intermediate level',3:'an advanced artist'};

    return `As someone <strong>${levels[skill]||'exploring airbrushing'}</strong> focused on <strong>${names[useCase]||'creative work'}</strong>, the <strong>${top.name}</strong> is your ideal match.`;
  }

  function getWhyText(ab) {
    const reasons = {
      'hs-ultra':'German-engineered precision with a 0.2mm nozzle for stunning fine detail work at a mid-range price.',
      'iwata-eclipse':'The industry workhorse — versatile 0.35mm nozzle handles everything from fine lines to broad coverage.',
      'badger-patriot':'Best bang-for-buck entry point with forgiving 0.5mm nozzle and dead-simple maintenance.',
      'iwata-neo':'Affordable Iwata quality perfect for learning fundamentals without breaking the bank.',
      'paasche-talon':'Three needle sizes in one kit gives you unmatched versatility across any project type.',
      'iwata-micron':'The pinnacle of airbrush engineering — micro-air control delivers unparalleled photorealistic detail.',
      'hs-infinity':'The finest nozzle on the market at 0.15mm. When only absolute precision will do.'
    };
    return reasons[ab.id] || 'A great all-around airbrush for your needs.';
  }

  /* ═══════════════════════════════════════
     SHOW RESULTS
  ═══════════════════════════════════════ */
  function showResults() {
    document.getElementById('abQuizBody').style.display = 'none';
    const loading = document.getElementById('abLoading');
    loading.classList.add('ab-show');

    setTimeout(()=>{
      loading.classList.remove('ab-show');
      const top3 = computeScores();
      const container = document.getElementById('abResults');

      container.innerHTML = `
        <div class="ab-header">
          <div class="ab-header-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </div>
          <h2 class="ab-title">Your <span class="ab-title-accent">Top Matches</span></h2>
        </div>
        <p class="ab-results-tagline">${getTagline(top3[0])}</p>
        ${top3.map((ab,i)=>`
          <div class="ab-rec-card${i===0?' ab-top-pick':''}">
            <div class="ab-rec-header">
              <span class="ab-rec-rank">${i===0?'🏆 Best Match':'#'+(i+1)+' Runner-up'}</span>
              <span class="ab-rec-match"><b>${ab.matchPct}%</b> match</span>
            </div>
            <div class="ab-rec-name">${ab.name}</div>
            <div class="ab-rec-why">${getWhyText(ab)}</div>
            <div class="ab-match-bar-track">
              <div class="ab-match-bar-fill" data-pct="${ab.matchPct}"></div>
            </div>
            <div class="ab-specs">
              ${ab.tags.map(t=>`<span class="ab-spec-tag">${t}</span>`).join('')}
            </div>
          </div>
        `).join('')}
        <div class="ab-cta-section">
          <a class="ab-cta-link" href="/best-airbrush-for-beginners/">
            Read Full Reviews
            <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <br>
          <button class="ab-retake" onclick="abRetake()">↻ Retake Quiz</button>
        </div>
      `;

      container.style.display = 'block';
      requestAnimationFrame(()=>{
        container.classList.add('ab-show');
        // Animate match bars
        setTimeout(()=>{
          container.querySelectorAll('.ab-match-bar-fill').forEach(bar=>{
            bar.style.width = bar.getAttribute('data-pct')+'%';
          });
        },300);
      });
    },1400);
  }

})();
</script>
