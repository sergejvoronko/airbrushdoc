<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Airbrush Technique Bible — AirbrushDOC (V2)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: oklch(15% 0.02 30);
            --bg-elevated: oklch(20% 0.03 30);
            --text: oklch(92% 0.01 30);
            --text-muted: oklch(70% 0.02 30);
            --accent: oklch(65% 0.25 45);
            --accent-bright: oklch(70% 0.25 45);
            --border: oklch(30% 0.03 30);
            
            --font-display: 'Bricolage Grotesque', sans-serif;
            --font-body: 'Sora', sans-serif;
            
            --page-width: 210mm;
            --page-height: 297mm;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: oklch(10% 0.01 30);
            color: var(--text);
            font-family: var(--font-body);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        html::before {
            content: "";
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 1000;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- Page Container --- */
        .book-container {
            width: var(--page-width);
            max-width: 100vw;
            background: transparent;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 60px 0;
            margin-top: 40px;
        }

        /* Fit to Screen Height Mode */
        body.fit-page .book-container {
            --zoom-scale: calc((100vh - 120px) / 297mm);
            transform: scale(var(--zoom-scale));
            margin-bottom: calc(var(--page-height) * (var(--zoom-scale) - 1));
            margin-top: 20px;
        }

        /* Spread View */
        .book-container.spread-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: calc(var(--page-width) * 2);
            gap: 4px 0;
            background: transparent;
            padding: 40px;
        }

        .book-container.spread-view section:nth-child(odd) {
            border-right: 1px solid oklch(5% 0 0);
            box-shadow: 20px 0 50px oklch(0% 0 0 / 0.3);
            border-radius: 4px 0 0 4px;
        }

        .book-container.spread-view section:nth-child(even) {
            box-shadow: -20px 0 50px oklch(0% 0 0 / 0.3);
            border-radius: 0 4px 4px 0;
        }

        /* Zoom to Width */
        .book-container.zoom-width:not(.fit-page) {
            transform: scale(var(--zoom-scale, 1));
            margin-bottom: calc((var(--page-height) * (var(--zoom-scale, 1) - 1)) + 40px);
        }

        /* --- Individual Page / Section --- */
        section {
            padding: 25mm 20mm;
            width: var(--page-width);
            height: var(--page-height);
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            box-shadow: 0 10px 40px oklch(0% 0 0 / 0.5), 0 0 0 1px var(--border);
            border-radius: 2px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Page Numbering */
        .page-footer {
            position: absolute;
            bottom: 15mm;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Typography */
        h1, h2, h3 {
            font-family: var(--font-display);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 2rem;
            color: var(--accent);
        }

        h1 { font-size: 3.5rem; margin-top: 2rem; }
        h2 { font-size: 2.5rem; margin-top: 4rem; border-bottom: 4px solid var(--accent); display: inline-block; padding-bottom: 0.2em; }
        h3 { font-size: 1.75rem; margin-top: 3rem; color: var(--text); border-left: 8px solid var(--accent); padding-left: 1rem; }

        p {
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 2rem;
            color: var(--text);
            text-align: justify;
            hyphens: auto;
        }

        ul, ol {
            margin-left: 2rem;
            margin-bottom: 2rem;
        }

        li {
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 1rem;
            padding-left: 0.5rem;
        }

        strong {
            font-weight: 700;
            color: white;
        }

        em {
            color: var(--accent-bright);
            font-style: italic;
        }

        /* Callouts / Projects */
        .callout {
            background: var(--bg-elevated);
            border: 2px solid var(--border);
            border-radius: 1.5rem;
            padding: 2.5rem;
            margin: 3rem 0;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px oklch(0% 0 0 / 0.2);
        }

        .callout::before {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 8px;
            background: var(--accent);
        }

        .callout h4 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        /* Images in content */
        .content-image {
            width: 100%;
            border-radius: 1rem;
            border: 1px solid var(--border);
            margin: 2rem 0;
            box-shadow: 0 10px 40px oklch(0% 0 0 / 0.4);
        }

        /* Cover Specific */
        section.cover {
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, oklch(35% 0.15 45 / 0.3), transparent 70%);
            padding: 20mm;
            height: var(--page-height);
        }

        .cover-title {
            font-size: 6rem;
            margin-bottom: 1rem;
            line-height: 0.9;
        }

        .cover-subtitle {
            font-size: 2rem;
            color: var(--text-muted);
            margin-bottom: 4rem;
            font-family: var(--font-display);
            font-weight: 400;
            letter-spacing: 0.1em;
        }

        /* Chapter Openers */
        section.opener {
            padding: 0;
            justify-content: flex-end;
            background: oklch(5% 0 0);
            height: var(--page-height);
        }

        .opener-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            mask-image: linear-gradient(to bottom, black 40%, transparent);
        }

        .opener-content {
            position: relative;
            z-index: 1;
            padding: 30mm 20mm;
            background: linear-gradient(to top, var(--bg) 30%, transparent);
        }

        .ch-number {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .ch-title {
            font-family: var(--font-display);
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0;
            text-wrap: balance;
            letter-spacing: -0.02em;
        }

        /* Table of Contents */
        .toc-list { list-style: none; margin-left: 0; }
        .toc-item { display: flex; align-items: baseline; margin-bottom: 1rem; text-decoration: none; color: var(--text); transition: color 0.2s; }
        .toc-item:hover { color: var(--accent); }
        .toc-dot { flex: 1; border-bottom: 1px dotted var(--border); margin: 0 1rem; }
        .toc-title { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
        .toc-num { font-family: var(--font-display); font-weight: 800; color: var(--accent); }

        /* Print Settings */
        @media print {
            @page { size: A4 portrait; margin: 0; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            html, body { background: white !important; color: black !important; }
            .book-container { width: 210mm !important; max-width: none !important; box-shadow: none !important; gap: 0 !important; padding: 0 !important; margin: 0 !important; }
            section { width: 210mm !important; height: 297mm !important; padding: 25mm 20mm !important; border: none !important; box-shadow: none !important; page-break-after: always !important; break-after: page !important; background: white !important; color: black !important; }
            .controls, .print-tip, .page-footer { display: none !important; }
            h1, h2, h3, p, li, strong, em, .ch-title, .ch-number { color: black !important; }
        }

        /* Fixed components for screen */
        .controls {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 100;
        }

        .print-tip {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: oklch(25% 0.05 30);
            padding: 1rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            max-width: 200px;
            border: 1px solid var(--border);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 3rem;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 30px oklch(0% 0 0 / 0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.05);
            background: var(--accent-bright);
            box-shadow: 0 15px 40px oklch(0% 0 0 / 0.6);
        }

        #book-source { display: none; }
    </style>
</head>
<body>

    <div class="print-tip">
        <strong>Print Tip:</strong> Use "Fit to Page" for a true digital reading experience. Gaps are for screen visibility only.
    </div>

    <div class="controls">
        <button class="btn" onclick="toggleView('single')">Single View</button>
        <button class="btn" onclick="toggleView('spread')">Spread View</button>
        <button class="btn" onclick="toggleFit()">Fit to Page</button>
        <button class="btn" onclick="toggleZoom()">Zoom to Width</button>
        <button class="btn" onclick="window.print()" style="margin-top: 1rem; opacity: 0.8;">Print to PDF</button>
    </div>

    <div id="book-source">
        <!-- Chapters will be injected here during initial load -->
    </div>

    <div class="book-container">
        <div style="padding: 100px; text-align: center; color: var(--accent);">
            <h1>Initializing Book...</h1>
            <p>Processing pagination for best reading experience.</p>
        </div>
    </div>

    <script>
        // Store original content as a simple object to avoid DOM extraction issues
        const chaptersData = [
            { id: 'cover', class: 'cover', content: `
                <h1 class="cover-title">The Airbrush<br>Technique Bible</h1>
                <p class="cover-subtitle">From First Spray to Professional Results</p>
                <div class="no-break"><hr />
                <p><em>From First Spray to Professional Results</em></p>
                <p>Master Every Technique, Surface & Style</p>
                <h3>By AirbrushDOC</h3>
                <p>airbrushdoc.com</p>
                <p>17 Chapters • Step-by-Step Projects • Troubleshooting Encyclopedia • Business Guide</p>
                </div>
            `},
            { id: 'toc-opener', class: 'opener', content: `
                <img src="/images/book/intro.png" class="opener-image" alt="Table of Contents">
                <div class="opener-content"><h1 class="ch-title">Table of Contents</h1></div>
            `},
            { id: 'intro', class: 'content-section', content: `
                <h1>Table of Contents</h1>
                <ul class="toc-list">
                    <li><a href="#toc" class="toc-item"><span class="toc-title">Table of Contents</span><span class="toc-dot"></span><span class="toc-num"></span></a></li>
                    <li><a href="#part1" class="toc-item"><span class="toc-title">Part One: Foundations</span><span class="toc-dot"></span><span class="toc-num"></span></a></li>
                    <li><a href="#ch1" class="toc-item"><span class="toc-title">Chapter 1: Understanding Your Airbrush</span><span class="toc-dot"></span><span class="toc-num"></span></a></li>
                    <li><a href="#ch17" class="toc-item"><span class="toc-title">Chapter 17: Finding Clients</span><span class="toc-dot"></span><span class="toc-num"></span></a></li>
                </ul>
                <hr />
                <h3>Introduction: Why This Book Exists</h3>
                <p>There are thousands of airbrush tutorials online. YouTube is full of them. So why would you pay for a book?</p>
                <p>Because tutorials teach you tricks. This book teaches you how to think.</p>
                <p>The difference between an airbrush hobbyist and someone who can confidently take on any project is not a collection of memorized techniques &mdash; it's a deep understanding of how paint, air, distance, and surface interact. Once you understand the principles, you can figure out any technique yourself.</p>
                <h3>How to Use This Book</h3>
                <p>Each chapter follows the same structure: a theory section explaining the "why" behind the technique, followed by a step-by-step project that puts it into practice. I strongly recommend doing the projects in order for the first read-through. Each one builds skills you'll need later.</p>
            `},
            { id: 'ch1-opener', class: 'opener', content: `
                <img src="/images/book/ch01.png" class="opener-image" alt="Chapter 1">
                <div class="opener-content"><div class="ch-number">Chapter 1</div><h1 class="ch-title">Understanding Your Airbrush</h1></div>
            `},
            { id: 'ch1-content', class: 'content-section', content: `
                <p>Before you spray a single drop of paint, you need to understand the machine in your hand. Not just "pull back for paint, push down for air" &mdash; but how the needle, nozzle, and air cap work together to atomize paint into a controlled mist. This understanding is what separates someone who follows tutorials from someone who can improvise.</p>
                <h3>The Anatomy of an Airbrush</h3>
                <p>Every dual-action, gravity-feed airbrush shares the same core components, regardless of whether it cost $50 or $500. The differences between price points come down to machining tolerances, materials, and ergonomics &mdash; but the physics are identical.</p>
                <p>Let's walk through each component from front to back, because the order matters &mdash; the front end is where precision happens, and the back end is where control begins.</p>
                <h3>The Nozzle (Fluid Tip):</h3>
                <p>This tiny, precisely machined cone sits at the very front of the airbrush. It has a microscopic opening &mdash; as small as 0.15mm on fine-detail models &mdash; through which paint exits. The nozzle is arguably the most important component because its bore diameter determines the finest line your airbrush can produce. Nozzles are also the most fragile part: the tip can crack if you overtighten it or drop the airbrush, and even a hairline crack will cause air to leak backward into the paint cup (you'll see bubbling).</p>
                <h3>The Needle:</h3>
                <p>A long, tapered steel rod that runs through the entire body of the airbrush and seats into the nozzle opening. When the needle is fully forward, it seals the nozzle shut and no paint flows. When you pull the trigger back, the needle retracts from the nozzle, creating a gap between the needle tip and the nozzle bore. The size of that gap determines how much paint flows through.</p>
                <p>A tiny retraction produces a hair-thin line; a large retraction opens the flow for wide coverage. The needle taper &mdash; the angle at which the tip narrows &mdash; varies between models. A long, gradual taper gives finer control over small movements, which is why detail airbrushes feel different from general-purpose models even with the same nozzle size.</p>
            `}
        ];

        const container = document.querySelector('.book-container');
        let currentView = 'single';
        let isZoomed = false;
        let isFit = false;

        function toggleView(view) {
            currentView = view;
            if (view === 'spread') {
                container.classList.add('spread-view');
            } else {
                container.classList.remove('spread-view');
            }
            if (isZoomed || isFit) updateZoom();
        }

        function toggleFit() {
            isFit = !isFit;
            if (isFit) {
                isZoomed = false;
                container.classList.remove('zoom-width');
                document.body.classList.add('fit-page');
            } else {
                document.body.classList.remove('fit-page');
            }
        }

        function toggleZoom() {
            isZoomed = !isZoomed;
            if (isZoomed) {
                isFit = false;
                document.body.classList.remove('fit-page');
                container.classList.add('zoom-width');
                updateZoom();
                window.addEventListener('resize', updateZoom);
            } else {
                container.classList.remove('zoom-width');
                container.style.setProperty('--zoom-scale', 1);
                window.removeEventListener('resize', updateZoom);
            }
        }

        function updateZoom() {
            if (!isZoomed && !isFit) return;
            if (isZoomed) {
                const viewWidth = window.innerWidth - 120;
                const bookWidth = container.offsetWidth;
                const scale = viewWidth / bookWidth;
                container.style.setProperty('--zoom-scale', Math.min(scale, 2));
            }
        }

        function paginate() {
            const pageHeightPx = 297 * (96 / 25.4);
            container.innerHTML = ''; 
            let globalPageNum = 1;

            chaptersData.forEach(data => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = data.content;
                
                const isOpener = data.class.includes('opener') || data.class.includes('cover');
                
                if (isOpener) {
                    const newPage = document.createElement('section');
                    newPage.className = data.class;
                    newPage.innerHTML = data.content;
                    addFooter(newPage, globalPageNum++);
                    container.appendChild(newPage);
                    return;
                }

                let currentPage = createNewPage(data.id, data.class);
                container.appendChild(currentPage);

                const elements = Array.from(tempDiv.children);
                elements.forEach(el => {
                    currentPage.appendChild(el.cloneNode(true));
                    if (currentPage.scrollHeight > pageHeightPx) {
                        if (currentPage.children.length > 1) {
                            currentPage.removeChild(currentPage.lastElementChild);
                            addFooter(currentPage, globalPageNum++);
                            currentPage = createNewPage(data.id + '-cont', data.class);
                            container.appendChild(currentPage);
                            currentPage.appendChild(el.cloneNode(true));
                        } else {
                            addFooter(currentPage, globalPageNum++);
                            currentPage = createNewPage(data.id + '-cont', data.class);
                            container.appendChild(currentPage);
                        }
                    }
                });
                
                if (currentPage.children.length > 0 && !currentPage.querySelector('.page-footer')) {
                    addFooter(currentPage, globalPageNum++);
                }
            });
        }

        function createNewPage(id, className) {
            const page = document.createElement('section');
            page.id = id;
            page.className = className;
            return page;
        }

        function addFooter(page, num) {
            const footer = document.createElement('div');
            footer.className = 'page-footer';
            footer.innerHTML = `— ${num} —`;
            page.appendChild(footer);
        }

        window.onload = paginate;
    </script>
</body>
</html>
